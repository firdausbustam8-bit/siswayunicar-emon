<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sisway UniCar | Student-Friendly E-Hailing Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #111c38;
            --bg-input: #1a2747;

            --navy-button: #162447;
            --navy-button-hover: #1f3363;
            --accent-bright-blue: #0088ff;
            --accent-bright-hover: #0077e6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e2d52;

            --radius-lg: 16px;
            --radius-md: 8px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-wrapper {
            flex: 1 0 auto;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ===================================================
           NAVBAR KEMAS & RESPONSIVE (DIBETULKAN)
        ====================================================== */
        nav {
            background: #050b18;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 0;
            border-bottom: 1px solid #162447;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        /* BUTANG KIRI: LOGO BRAND */
        .brand-logo-btn {
            background: var(--navy-button);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 700;
            font-size: 0.85rem;
            color: #ffffff !important;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .brand-logo-btn:hover {
            background: var(--navy-button-hover);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* BUTANG KANAN: BADGE KERETA & BAHASA */
        .car-badge-btn, .lang-btn {
            font-size: 0.8rem;
            background: var(--navy-button);
            color: #ffffff !important;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .car-badge-btn:hover, .lang-btn:hover {
            background: var(--navy-button-hover);
        }

        /* SUSUNAN KHAS UNTUK SKRIN MOBILE (PHONE) */
        @media (max-width: 480px) {
            nav {
                padding: 8px 0;
            }
            .brand-logo-btn {
                font-size: 0.78rem;
                padding: 6px 8px;
            }
            .car-badge-btn {
                font-size: 0.75rem;
                padding: 6px 8px;
            }
            .lang-btn {
                font-size: 0.75rem;
                padding: 6px 8px;
            }
        }

        /* ===================================================
           KANDUNGAN UTAMA
        ====================================================== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
            width: 100%;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            margin: 24px 0;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .welcome-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .welcome-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--accent-bright-blue);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 136, 255, 0.3);
        }
        .btn-primary:hover {
            background: var(--accent-bright-hover);
        }

        /* FOOTER */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 20px;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            background: #050b18;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- NAVBAR -->
        <nav>
            <div class="container nav-content">
                <button class="brand-logo-btn">
                    🚗 <span>Sisway UniCar</span>
                </button>
                <div class="nav-actions">
                    <button class="car-badge-btn">
                        Perodua Bezza 1.3 X
                    </button>
                    <button class="lang-btn">🇲🇾 BM</button>
                </div>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="container">
            <div id="page-main" class="page active">
                <div class="welcome-box">
                    <div class="welcome-title">👋 Welcome to Sisway UniCar!</div>
                    <div class="welcome-desc">
                        Student-friendly Grab/e-hailing booking system. Enjoy safe, comfortable, and affordable rides designed specifically for campus students & the Northern Region!
                    </div>
                    <button class="btn btn-primary" style="max-width: 280px; margin: 0 auto;">
                        🚀 Let's Booking!!!
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p><strong>Sisway UniCar</strong> by Mr.Emon</p>
        <p>Perodua Bezza 1.3 X Private Ride Service (Northern Region)</p>
    </footer>

</body>
</html>
